version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]